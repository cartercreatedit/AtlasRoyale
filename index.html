<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortnite OG ✦ Play Free</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cloudflare.com"></script>
</head>
<body>
    <!-- ── TRADITIONAL FORTNITE CORE HUD OVERLAY ── -->
    <div id="crosshair"></div>
    
    <div id="game-hud" style="display: none;">
        <div class="hud-top-left">
            <div id="player-tag">CARTER_CREATOR</div>
            <div class="bar-container health-bg"><div id="health-bar" style="width: 100%;"></div><span>100</span></div>
            <div class="bar-container shield-bg"><div id="shield-bar" style="width: 0%;"></div><span>0</span></div>
        </div>
        <div class="hud-bottom-right">
            <div id="mats-display">🪵 <span id="mats-val">100</span></div>
            <div id="weapon-display">✏️ AR RIFLE<br><span style="font-size: 14px; color: #00ffcc;">UNLIMITED</span></div>
        </div>
    </div>

    <!-- ── AUTHENTIC OG LOADING SCREEN OVERLAY ── -->
    <div id="loading-screen">
        <div id="loading-content">
            <div id="game-logo">FORTNITE</div>
            <div id="sub-logo">BATTLE ROYALE</div>
            <div id="loading-tip">TIP: Use your wood resources wisely. Building walls can instantly block incoming rifle tracking lines!</div>
            <div id="progress-container"><div id="progress-bar"></div></div>
        </div>
    </div>

    <!-- ── GAME LAUNCH MENU LOBBY DECK ── -->
    <div id="lobby-menu" style="display: none;">
        <div id="lobby-header">
            <div class="nav-tab active">PLAY</div>
            <div class="nav-tab">LOCKER</div>
            <div class="nav-tab">STORE</div>
        </div>
        <div id="player-showcase">
            <div id="holo-character">✦</div>
        </div>
        <div id="match-panel">
            <div style="font-size: 14px; color: #888; letter-spacing: 1px;">CHOOSE MODE</div>
            <div style="font-size: 24px; font-weight: bold; margin: 4px 0 15px 0; color: #fff;">SOLO (OG MAP)</div>
            <button id="play-button">PLAY</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
