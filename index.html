<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AtlasRoyale ✦ Unblocked</title>
    <link rel="stylesheet" href="style.css">
    <!-- Secure Web Core Link to Three.js 3D Engine Library Layer -->
    <script src="https://cloudflare.com"></script>
</head>
<body>
    <!-- Tactical Center Target Crosshair Ring -->
    <div id="crosshair"></div>

    <!-- Google Console Style Instructions Start Gate Window -->
    <div id="blocker">
        <div id="instructions">
            <p style="font-size:38px; font-weight:600; letter-spacing:1px; margin-bottom:10px; color:#ffffff;">✦ ATLAS ROYALE ✦</p>
            <p style="color:#00ffcc; font-size:16px; margin-top:0; margin-bottom:30px; text-transform:uppercase; letter-spacing:2px;">Browser Engine v1.0</p>
            <div style="background-color:#111111; border:1px solid #222222; border-radius:12px; padding:20px; max-width:400px; margin:0 auto; text-align:left; box-shadow:0 10px 30px rgba(0,0,0,0.5);">
                <p style="margin:5px 0; color:#fff;"><b>MOVE:</b> W, A, S, D Keys</p>
                <p style="margin:5px 0; color:#fff;"><b>LOOK:</b> Move Mouse</p>
                <p style="margin:5px 0; color:#fff;"><b>JUMP:</b> Spacebar</p>
                <p style="margin:5px 0; color:#a855f7;"><b>BUILD WALL:</b> Right Click Mouse</p>
            </div>
            <p style="font-size:18px; margin-top:30px; color:#888888; animation: pulse 1.5s infinite;">Click Anywhere on Screen to Deploy & Play</p>
        </div>
    </div>

    <!-- Local Style Configuration Layout Anchor for Pulse Animation -->
    <style>
        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }
    </style>

    <!-- Connects Your Custom 3D JavaScript Gaming Engine Script -->
    <script src="game.js"></script>
</body>
</html>
